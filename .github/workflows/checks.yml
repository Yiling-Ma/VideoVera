name: Code checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[geometry,navigation,dev]'
      - run: python -m ruff check data_generator
      - run: python -m compileall -q data_generator
      - run: videovera --help
      - run: python -m data_generator --help
