<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description">
<title id="title">VideoVera data construction pipeline</title>
<desc id="description">Official navigation, RGB-D scene and temporal annotations generate eight tasks. Candidates retain videos, answers, ordered reference claims and source evidence. Human review is followed by schema validation, source isolation, media and semantic deduplication, and physical-scene limits. Frozen benchmark, existing corpus and warm-up inputs are preserved during release export.</desc>
