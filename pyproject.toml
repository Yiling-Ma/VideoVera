[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videovera"
version = "1.0.0"
description = "Annotation-derived data construction for verifiable video reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "jsonschema>=4.18"]

[project.optional-dependencies]
geometry = ["opencv-python>=4.8"]
navigation = ["numpy-quaternion>=2023.0.0", "imageio>=2.31", "opencv-python>=4.8"]
dev = ["ruff>=0.8"]

[project.scripts]
videovera = "data_generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_generator*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
